# OPTIONAL: network segmentation ("least privilege" for network traffic).
# Only enforced if the cluster runs a CNI that supports NetworkPolicy,
# e.g.  minikube start --cni=calico   (the default minikube network ignores it).
#
#   internet -> frontend -> books-service  -> mongo
#                        -> reviews-service -> mongo
#                           reviews-service -> books-service
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: bookhub
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-from-anywhere
  namespace: bookhub
spec:
  podSelector: { matchLabels: { app: frontend } }
  ingress:
    - ports: [{ port: 5000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: books-from-frontend-and-reviews
  namespace: bookhub
spec:
  podSelector: { matchLabels: { app: books-service } }
  ingress:
    - from:
        - podSelector: { matchLabels: { app: frontend } }
        - podSelector: { matchLabels: { app: reviews-service } }
      ports: [{ port: 5001 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reviews-from-frontend
  namespace: bookhub
spec:
  podSelector: { matchLabels: { app: reviews-service } }
  ingress:
    - from:
        - podSelector: { matchLabels: { app: frontend } }
      ports: [{ port: 5002 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongo-from-backends
  namespace: bookhub
spec:
  podSelector: { matchLabels: { app: mongo } }
  ingress:
    - from:
        - podSelector: { matchLabels: { app: books-service } }
        - podSelector: { matchLabels: { app: reviews-service } }
      ports: [{ port: 27017 }]
