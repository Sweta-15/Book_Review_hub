# OPTIONAL: automatic horizontal scaling (Auto-Scaling pattern).
# Needs the metrics server:   minikube addons enable metrics-server
# Each microservice gets its OWN autoscaler -> they scale independently.
# Note: once an HPA owns a Deployment, it overrides `replicas` in 20-services.yaml.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  namespace: bookhub
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: frontend }
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: books-service
  namespace: bookhub
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: books-service }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: reviews-service
  namespace: bookhub
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: reviews-service }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
